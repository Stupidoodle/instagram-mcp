[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_mcp"]

[project]
name = "instagram-mcp"
version = "0.1.0"
description = "Enterprise-grade MCP server for Instagram Direct Message handling"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Bryan Tran" }]
keywords = ["mcp", "instagram", "direct-messages", "instagrapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "instagrapi>=3.0.14",
    "mcp[cli]>=2.2.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
instagram-mcp = "instagram_mcp.server:main"
instagram-bridge = "instagram_mcp.bridge:main"
instagram-mcp-login = "instagram_mcp.client:interactive_login"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: End-to-end tests requiring real Instagram credentials and network access",
]

[tool.coverage.run]
source = ["src/instagram_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true
