# Keeps every dependency on its newest release without anyone doing anything.
# instagrapi is the important one: its releases carry the newest Instagram app
# version, which the client emulates. A pushed upgrade is released and deployed by
# release.yml, called from here: a push made with GITHUB_TOKEN starts no workflow.
name: Upgrade dependencies

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-deps
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Upgrade the lockfile
        id: lock
        run: |
          uv lock --upgrade 2>&1 | tee lock.log
          if git diff --quiet uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test against the locked versions
        run: |
          uv sync --locked
          uv run pytest -q tests/unit tests/integration

      # A new ruff or mypy release can find things the old one didn't; such an upgrade
      # waits until the code is fixed instead of landing on main red.
      - name: Lint and type-check against the locked versions
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Commit and push
        if: steps.lock.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "build(deps): upgrade locked dependencies"; echo; grep -E '^Updated ' lock.log || true; } > msg.txt
          git commit -q uv.lock -F msg.txt
          git push

  # Its test job runs again on the commit before the push; the upgraded tree was
  # checked above, and the release job takes the newest main.
  release:
    needs: upgrade
    if: needs.upgrade.outputs.pushed == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit
